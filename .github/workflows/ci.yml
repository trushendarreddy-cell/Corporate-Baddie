name: CorporateBaddie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        shell: bash
        run: |
          set +e
          npm run lint > lint.log 2>&1
          code=$?
          cat lint.log
          exit $code
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: lint.log
      - run: npm run build
